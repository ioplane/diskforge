---
name: Feature request
description: Propose a reusable capability or safety improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the operator or API problem without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Environment and evidence
      description: Identify the Linux, image, and device classes in scope.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Describe API, CLI, JSON, safety, and compatibility effects.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The proposal keeps ambiguous target state fail-closed.
          required: true
        - label: The proposal does not require shell scripts or host Go tooling.
          required: true
