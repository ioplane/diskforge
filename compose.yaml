---
name: diskforge

x-verification-environment: &verification-environment
  CGO_ENABLED: "0"
  HOME: /tmp/home
  XDG_CACHE_HOME: /tmp/cache

x-verification-service: &verification-service
  image: localhost/ioplane/diskforge-dev:1.26.5
  working_dir: /workspace
  read_only: true
  network_mode: none
  security_opt:
    - no-new-privileges=true
  environment:
    <<: *verification-environment
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=2g
  volumes:
    - .:/workspace:ro

x-release-service: &release-service
  image: localhost/ioplane/diskforge-release:2.17.1
  working_dir: /workspace
  read_only: true
  security_opt:
    - no-new-privileges=true
  environment:
    CGO_ENABLED: "0"
    GIT_DIR: ${DISKFORGE_GIT_DIR:-/git-common}
    GIT_WORK_TREE: /workspace
    GOTOOLCHAIN: local
    HOME: /tmp/home
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=2g
  volumes:
    - .:/workspace:ro
    - ${DISKFORGE_GIT_COMMON_DIR:-.git}:/git-common:ro

services:
  format:
    <<: *verification-service
    volumes:
      - .:/workspace:rw
      - ${DISKFORGE_GIT_COMMON_DIR:-.git}:/git-common:ro
    command: ["gofumpt", "-w", "."]

  lint:
    <<: *verification-service
    command: ["golangci-lint", "run", "--config", ".config/golangci.yml"]

  lint-integration:
    <<: *verification-service
    command:
      - golangci-lint
      - run
      - --config
      - .config/golangci.yml
      - --build-tags
      - integration

  gopls:
    <<: *verification-service
    command:
      - find
      - .
      - -type
      - f
      - -name
      - "*.go"
      - -not
      - -path
      - ./vendor/*
      - -exec
      - gopls
      - check
      - "{}"
      - "+"

  modcheck:
    <<: *verification-service
    command: ["go", "mod", "tidy", "-diff"]

  test:
    <<: *verification-service
    command: ["gotestsum", "--", "-count=1", "./..."]

  race:
    <<: *verification-service
    environment:
      <<: *verification-environment
      CGO_ENABLED: "1"
    command: ["gotestsum", "--", "-race", "-count=1", "./..."]

  fuzz:
    <<: *verification-service
    command:
      - go
      - test
      - -run=^$
      - -fuzz=Fuzz
      - -fuzztime=30s
      - ./internal/image

  vuln:
    <<: *verification-service
    network_mode: bridge
    command: ["govulncheck", "./..."]

  staticcheck:
    <<: *verification-service
    command: ["staticcheck", "./..."]

  gosec:
    <<: *verification-service
    command: ["gosec", "-quiet", "./..."]

  deadcode:
    <<: *verification-service
    command: ["deadcode", "-test", "./..."]

  build:
    <<: *verification-service
    environment:
      <<: *verification-environment
      CGO_ENABLED: "0"
      GOARCH: amd64
      GOOS: linux
    command:
      - go
      - build
      - -trimpath
      - -ldflags=-s -w -buildid=
      - -o
      - /tmp/diskforge
      - ./cmd/diskforge

  docs:
    <<: *verification-service
    command:
      - sh
      - -ec
      - >-
        markdownlint-cli2 --config .config/markdownlint-cli2.yaml
        "**/*.md" ".github/**/*.md" &&
        cspell --config .config/cspell.json
        "**/*.{go,md,yaml,yml}" ".github/**/*.{md,yaml,yml}" &&
        yamllint --config-file .config/yamllint.yml --strict .

  actions:
    <<: *verification-service
    command: ["actionlint", "-config-file", ".github/actionlint.yaml"]

  integration:
    <<: *verification-service
    privileged: true
    security_opt: []
    volumes:
      - .:/workspace:ro
      - ./test/integration/testdata/proc-swaps:/proc/swaps:ro
    command: ["gotestsum", "--", "-tags=integration", "-count=1", "./..."]

  release-check:
    <<: *release-service
    network_mode: none
    command: ["goreleaser", "check", ".config/goreleaser.yaml"]

  release-snapshot:
    <<: *release-service
    read_only: false
    network_mode: bridge
    volumes:
      - .:/workspace:rw
      - ${DISKFORGE_GIT_COMMON_DIR:-.git}:/git-common:ro
    command:
      - goreleaser
      - release
      - --config
      - .config/goreleaser.yaml
      - --snapshot
      - --clean
      - --skip=sign,publish

  release:
    <<: *release-service
    read_only: false
    network_mode: bridge
    environment:
      CGO_ENABLED: "0"
      GIT_DIR: ${DISKFORGE_GIT_DIR:-/git-common}
      GIT_WORK_TREE: /workspace
      GOTOOLCHAIN: local
      HOME: /tmp/home
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-}
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}
    volumes:
      - .:/workspace:rw
      - ${DISKFORGE_GIT_COMMON_DIR:-.git}:/git-common:ro
    command:
      - goreleaser
      - release
      - --config
      - .config/goreleaser.yaml
      - --clean
